name: SwarmWatch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & SwarmWatch
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio httpx websockets fastapi uvicorn cryptography build
          pip install -e packages/sdk-python

      - name: Run Python Test Suite (including Adversarial)
        run: |
          pytest packages/sdk-python/tests/ -v

  test-typescript:
    name: Test TypeScript SDK on Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run TypeScript Test Suite (including Adversarial)
        run: |
          cd packages/sdk-typescript
          npm test

  package-check:
    name: Build & Verify Wheel Distribution
    runs-on: ubuntu-latest
    needs: [test-python, test-typescript]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Package
        run: |
          python -m pip install --upgrade pip build twine
          cd packages/sdk-python
          python -m build

      - name: Check Package Quality
        run: |
          twine check packages/sdk-python/dist/*
