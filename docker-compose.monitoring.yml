services:
  swarmwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: swarmwatch:latest
    container_name: swarmwatch
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - swarmwatch_data:/data
    environment:
      - SWARMWATCH_HOST=0.0.0.0
      - SWARMWATCH_PORT=8765
      - SWARMWATCH_DB=/data/swarmwatch.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - swarmwatch_net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: swarmwatch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      swarmwatch:
        condition: service_healthy
    networks:
      - swarmwatch_net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: swarmwatch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=swarmwatch
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/swarmwatch-overview.json
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - swarmwatch_net

networks:
  swarmwatch_net:
    driver: bridge

volumes:
  swarmwatch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
