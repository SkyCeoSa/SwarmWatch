{{- if and (eq .Values.storage.backend "clickhouse") (not .Values.storage.clickhouse.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swarmwatch.fullname" . }}-secret
  labels:
    {{- include "swarmwatch.labels" . | nindent 4 }}
type: Opaque
data:
  clickhouse-password: {{ .Values.storage.clickhouse.password | default "" | b64enc | quote }}
{{- end }}
