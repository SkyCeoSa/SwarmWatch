[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmwatch"
version = "0.1.0"
description = "Universal Multi-Agent Observability, Entropy Circuit-Breaker, and Time-Machine Debugging Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
swarmwatch = "swarmwatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmwatch*"]
